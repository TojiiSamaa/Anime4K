<text x="24" y="410" class="m" font-size="11">Ground truth: 1080p crops of Pepper&amp;Carrot (David Revoy, CC BY 4.0), downscaled 2× then upscaled back. PSNR/SSIM reward closeness to the original, not perceived sharpness.</text><text x="24" y="428" class="m" font-size="11">Fidelity = PSNR of our native engine vs the original GLSL shaders run by libplacebo. Reliability = runs ok, and bit-identical output on two runs.</text>
